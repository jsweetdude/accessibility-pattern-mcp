name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build + regression + stdio smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (type-check + emit dist/)
        run: npm run build

      # Pre-publish gates. Both run against the compiled dist/ and the bundled
      # corpus, so they exercise exactly what ships on npm.
      - name: Regression suite
        run: node scripts/regression-runner.mjs

      - name: stdio handshake smoke
        run: node scripts/smoke-stdio.mjs

      - name: Pack (verify tarball contents)
        run: npm pack --dry-run
